version: "3.9"

# Local development only. Production database is a hosted PostgreSQL
# provider chosen in Phase 23 — this file never runs in production.
services:
  postgres:
    image: postgres:16
    container_name: nutripath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutripath
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: nutripath_dev
    ports:
      - "5432:5432"
    volumes:
      - nutripath-pg-data:/var/lib/postgresql/data

volumes:
  nutripath-pg-data: