name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nutripath_vector_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The solution includes the test project, so this restores and builds both.
      - name: Restore
        run: dotnet restore backend/NutriPath.slnx

      - name: Build
        run: dotnet build backend/NutriPath.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/NutriPath.Api.Tests/NutriPath.Api.Tests.csproj --no-build --configuration Release --filter 'FullyQualifiedName!~KnowledgeVectorIntegrationTests'

      - name: Verify PostgreSQL 16 and pgvector
        env:
          NUTRIPATH_VECTOR_TEST_DB: Host=127.0.0.1;Database=nutripath_vector_test;Username=postgres;Password=postgres
        run: >
          dotnet test tests/NutriPath.Api.Tests/NutriPath.Api.Tests.csproj
          --no-build --configuration Release
          --filter FullyQualifiedName~KnowledgeVectorIntegrationTests
          --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/NutriPath.Mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/NutriPath.Mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci
